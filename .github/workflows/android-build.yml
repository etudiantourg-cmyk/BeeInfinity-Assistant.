name: Android build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK package, SDK range and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.beinfinity.assistant.installfix'" /tmp/apk-badging.txt
          grep -q "sdkVersion:'26'" /tmp/apk-badging.txt
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Test installation and launch on Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.beinfinity.assistant.installfix -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell dumpsys package com.beinfinity.assistant.installfix | grep -q "versionName=0.2.1"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BeeInfinity-Assistant-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish APK download release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: BeeInfinity Assistant - Latest APK
          body: APK built, signature-verified, and installation-tested on an Android 10 emulator.
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
          fail_on_unmatched_files: true
